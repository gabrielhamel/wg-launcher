[package]
name = "wg-launcher"
version = "1.2.0"
edition = "2024"
description = "A reusable Rust client and CLI for the Wargaming Update Service"
license = "MIT"
repository = "https://github.com/gabrielhamel/wg-launcher"
homepage = "https://github.com/gabrielhamel/wg-launcher"
authors = ["Gabriel Hamel <gabriel.hamel.pro@gmail.com>"]
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["cli", "wot", "WorldOfTanks"]

[lib]
name = "wg_launcher"
path = "src/lib.rs"

[[bin]]
name = "wg-launcher"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
comfy-table = "8.0.1"
fs2 = "0.4"
futures-util = "0.3"
fast_rsync = "0.2"
indicatif = "0.18"
memmap2 = "0.9"
oxidelta = { version = "0.1.4", default-features = false, features = ["adler32", "lzma-secondary", "zlib-secondary"] }
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.13", default-features = false, features = ["http2", "rustls", "stream", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sevenz-rust = { version = "0.6", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
sevenz-rust = { version = "0.6", features = ["compress"] }
