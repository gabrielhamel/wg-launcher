# Regenerate release.yml with dist 0.33.1; do not edit generated CI directly.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.1"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
unix-archive = ".tar.gz"
pr-run-mode = "plan"
install-path = "CARGO_HOME"
# CLI self-update is built in; do not install a separate updater executable.
install-updater = false
publish-jobs = ["./publish-crates"]
github-custom-job-permissions = { "publish-crates" = { contents = "read" } }
