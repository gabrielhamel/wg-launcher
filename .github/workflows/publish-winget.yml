name: Publish WinGet package
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag
        required: true
        type: string
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      WINGET_TOKEN:
        required: true
permissions:
  contents: write
concurrency:
  group: publish-winget
  cancel-in-progress: false
jobs:
  publish:
    # Release 1.4.0 intentionally excludes WinGet, including manual retries.
    if: ${{ !contains(fromJSON('["1.4.0", "v1.4.0"]'), inputs.tag || fromJSON(inputs.plan).announcement_tag) }}
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || fromJson(inputs.plan).announcement_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate manifests from the verified Windows archive
        run: |
          python -m pip install --disable-pip-version-check PyYAML jsonschema
          python packaging/winget.py --tag "$env:RELEASE_TAG" --output output --validate
      - name: Install WinGet tooling
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-PackageProvider -Name NuGet -Force | Out-Null
          Install-Module -Name Microsoft.WinGet.Client -Force -Repository PSGallery -Scope AllUsers | Out-Null
          Repair-WinGetPackageManager -AllUsers -Force -IncludePreRelease
          winget --version
      - name: Validate and install the package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $manifest = "output/manifests/g/GabrielHamel/WgLauncher/$version"
          $ErrorActionPreference = 'Continue'
          $validation = winget validate --manifest $manifest --disable-interactivity 2>&1 | Out-String
          $validationStatus = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          Write-Output $validation
          if ($validationStatus -ne 0) {
            # WinGet 1.11 knows an older schema header than the community repository.
            # JSON-schema validation above uses the actual current Microsoft schema.
            # Accept only that specific header warning, never semantic/schema errors.
            $warnings = @($validation -split "`n" | Where-Object { $_ -match '^Manifest Warning:' })
            $otherWarnings = @($warnings | Where-Object { $_ -notmatch '^Manifest Warning: The schema header URL does not match the expected pattern\.' })
            if ($validationStatus -ne -1978335192 -or $warnings.Count -eq 0 -or $otherWarnings.Count -gt 0) { throw 'WinGet manifest validation failed' }
          }
          winget settings --enable LocalManifestFiles
          winget install --manifest $manifest --scope user --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw 'WinGet installation failed' }
          $binary = Get-ChildItem "$env:LOCALAPPDATA/Microsoft/WinGet/Packages" -Recurse -Filter wg-launcher.exe | Select-Object -First 1 -ExpandProperty FullName
          if (-not $binary) { throw 'WinGet did not install the executable' }
          $before = (Get-FileHash $binary -Algorithm SHA256).Hash
          $env:WG_LAUNCHER_NO_UPDATE_CHECK = '1'
          & $binary --version
          $ErrorActionPreference = 'Continue'
          $output = & $binary self-update 2>&1 | Out-String
          $status = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($status -eq 0 -or $output -notlike '*Self-update not supported*') { throw 'WinGet ownership was not respected' }
          if ((Get-FileHash $binary -Algorithm SHA256).Hash -ne $before) { throw 'Managed executable changed' }
          exit 0
      - name: Attach manifests to the release
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          cd output
          7z a ../wg-launcher-winget.zip "manifests/g/GabrielHamel/WgLauncher/$version"
          gh release upload "$RELEASE_TAG" ../wg-launcher-winget.zip --repo "$GITHUB_REPOSITORY" --clobber
      - name: Submit to the WinGet community repository
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $query = "GabrielHamel.WgLauncher $version in:title"
          $pulls = gh pr list --repo microsoft/winget-pkgs --state all --search $query --json title,url,state,mergedAt | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot check existing WinGet submissions' }
          $exactVersion = '(?<![0-9.])' + [regex]::Escape($version) + '(?![0-9.])'
          $existing = @($pulls | Where-Object { $_.title -match $exactVersion -and ($_.state -eq 'OPEN' -or $_.mergedAt) })
          if ($existing.Count -gt 0) {
            Write-Output "WinGet submission already exists: $($existing[0].url)"
            exit 0
          }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          & ./wingetcreate.exe submit --no-open --prtitle "New version: GabrielHamel.WgLauncher version $version" --token "$env:WINGET_TOKEN" "output/manifests/g/GabrielHamel/WgLauncher/$version"
          if ($LASTEXITCODE -ne 0) { throw 'WinGet submission failed' }
