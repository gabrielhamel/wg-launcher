name: Publish Homebrew formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag containing wg-launcher.rb
        required: true
        type: string
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_SSH_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: publish-homebrew
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download the published formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag || fromJson(inputs.plan).announcement_tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --pattern wg-launcher.rb --dir formula

      - name: Check out the Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: gabrielhamel/homebrew-tap
          ref: main
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}

      - name: Publish the formula
        env:
          RELEASE_TAG: ${{ inputs.tag || fromJson(inputs.plan).announcement_tag }}
        working-directory: tap
        run: |
          mkdir -p Formula
          cp ../formula/wg-launcher.rb Formula/wg-launcher.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/wg-launcher.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update wg-launcher to $RELEASE_TAG"
            git push origin HEAD:main
          fi
