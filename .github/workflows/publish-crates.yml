name: Publish update client

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      CRATES_IO_TOKEN:
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish update client
        run: cargo publish -p wg-update-client --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
