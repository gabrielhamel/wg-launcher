[package]
name = "wg-launcher-cli"
version.workspace = true
edition.workspace = true
description = "Command-line launcher for Wargaming game assets"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["cli", "wargaming", "launcher"]

[[bin]]
name = "wg-launcher"
path = "src/main.rs"
test = false

[dependencies]
wg-update-client = { version = "1.0.0", path = "../wg-update-client" }
clap = { version = "4.5", features = ["derive"] }
comfy-table = "8.0.1"
console = "0.16"
indicatif = "0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

serde_json = "1"
