[package]
name = "wg-launcher-cli"
version.workspace = true
edition.workspace = true
description = "Command-line launcher for World of Tanks assets"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["cli", "wot", "WorldOfTanks"]

[[bin]]
name = "wg-launcher"
path = "src/main.rs"

[dependencies]
wg-launcher = { version = "1.4.0", path = "../wg-launcher" }
clap = { version = "4.5", features = ["derive"] }
comfy-table = "8.0.1"
indicatif = "0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
