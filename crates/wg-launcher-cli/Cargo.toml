[package]
name = "wg-launcher-cli"
publish = false
version.workspace = true
edition.workspace = true
description = "Command-line launcher for Wargaming game assets"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
categories = ["command-line-utilities"]
keywords = ["cli", "wargaming", "launcher"]

[[bin]]
name = "wg-launcher"
path = "src/main.rs"
test = true

[dependencies]
wg-update-client = { path = "../wg-update-client" }
clap = { version = "4.5", features = ["derive"] }
comfy-table = { version = "8.0.1", features = ["custom_styling"] }
console = "0.16"
indicatif = "0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time"] }

serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
semver = "1"
url = "2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
self-replace = "1.5"
thiserror = "2"

# Keep binary releases enabled independently of crates.io publication.
[package.metadata.dist]
dist = true
formula = "wg-launcher"
