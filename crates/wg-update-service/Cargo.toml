[package]
name = "wg-update-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = true
description = "File-backed WGUS-compatible update service"
documentation = "https://docs.rs/wg-update-service"
readme = "README.md"
rust-version = "1.88"
categories = ["command-line-utilities"]
keywords = ["wgus", "wot", "update-server", "game-assets"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
test = false
doctest = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
url = "2"
