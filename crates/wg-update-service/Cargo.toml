[package]
name = "wg-update-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false
description = "File-backed WGUS-compatible update service"
documentation = "https://github.com/gabrielhamel/wg-launcher/blob/main/docs/update-service.md"
readme = "README.md"
rust-version = "1.88"
categories = ["command-line-utilities"]
keywords = ["wgus", "wot", "update-server", "game-assets"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[lib]
test = false
doctest = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
url = "2"

# The service is built from source; only the launcher has dist binaries.
[package.metadata.dist]
dist = false
