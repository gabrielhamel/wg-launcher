[package]
name = "wg-launcher-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Black-box end-to-end tests for wg-launcher and wg-update-service"

[dependencies]
fs2 = "0.4"
serde_json = "1"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
sevenz-rust = { version = "0.6", features = ["compress"] }

[[test]]
name = "e2e"
path = "tests/e2e.rs"

[[bin]]
name = "cli-update-fixture"
path = "src/bin/cli_update_fixture.rs"
test = false
